name: Build Windows app

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: CalVer tag created by tagpr
        type: string
        required: true
  push:
    branches:
      - main
    tags:
      - "[0-9][0-9][0-9][0-9].[0-9][0-9][0-9][0-9].*"
  pull_request:

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen pytest
      - name: Embed Git version
        id: version
        shell: pwsh
        run: |
          $versionArgs = @()
          if ($env:RELEASE_TAG) {
            $versionArgs = @('--release-tag', $env:RELEASE_TAG)
          }
          uv run --frozen python tools/write_build_info.py @versionArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content build/build_info.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build exe
        run: >-
          uv run --frozen pyinstaller --noconfirm --clean --onefile --windowed
          --name ImageCompressor --icon=assets/app-icon.ico
          --add-data "assets/app-icon.png;assets"
          --add-data "build/build_info.json;."
          --collect-all pillow_heif --additional-hooks-dir=. app.py
      - name: Smoke test bundled exe and version
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $process = Start-Process -FilePath .\dist\ImageCompressor.exe -ArgumentList @('--self-test', '--expected-version', $env:EXPECTED_VERSION) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "ImageCompressor.exe self-test failed with exit code $($process.ExitCode)"
          }
      - name: Prepare release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-package -Force
          Copy-Item .\dist\ImageCompressor.exe .\release-package\ImageCompressor.exe
          Copy-Item ".\output\pdf\はじめにお読みください.pdf" ".\release-package\はじめにお読みください.pdf"
          Compress-Archive -Path .\release-package\* -DestinationPath .\dist\ImageCompressor-windows.zip -Force
      - uses: actions/upload-artifact@v7.0.1
        with:
          path: dist/ImageCompressor-windows.zip
          archive: false
      - name: Publish GitHub Release
        if: env.RELEASE_TAG != '' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG .\dist\ImageCompressor-windows.zip --clobber
          } else {
            gh release create $env:RELEASE_TAG .\dist\ImageCompressor-windows.zip --verify-tag --generate-notes --title $env:RELEASE_TAG
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
