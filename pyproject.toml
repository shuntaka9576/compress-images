[project]
name = "compress-images"
version = "0.1.0"
description = "HEICなどのスマホ写真をまとめて縮小し、JPEGとして保存するデスクトップアプリ"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "pillow>=11.0,<13",
  "pillow-heif>=1.1,<2",
  "tkinterdnd2>=0.6.2,<0.7",
]

[dependency-groups]
dev = [
  "pyinstaller>=6.0,<7",
  "pytest>=8.0,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
required-version = "==0.12.3"
